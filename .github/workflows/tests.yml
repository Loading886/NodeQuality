name: IP quality tests
on: [push, pull_request]
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: go test -count=1 -timeout 60s ./...
      - run: go vet ./...
      - name: Race detector (SSH sessions and concurrent providers)
        if: runner.os == 'Linux'
        run: go test -race -timeout 60s ./...
  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Build standalone Linux servers
        run: |
          mkdir -p dist/licenses
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/nodequality-linux-amd64 ./cmd/nodequality
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o dist/nodequality-linux-arm64 ./cmd/nodequality
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp licenses/GO-BSD.txt dist/licenses/
          cd dist
          sha256sum nodequality-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nodequality-linux-servers
          path: dist/
          retention-days: 7
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n NodeQuality.sh
  powershell:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Native PowerShell tests (no Python)
        shell: pwsh
        run: ./tests/test_powershell.ps1
